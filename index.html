<!DOCTYPE html>
<html>
<head>
<title>Delicious Bites Restaurant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

body{
font-family: Arial;
margin:0;
background:#f4f4f4;
}

header{
background:#e74c3c;
color:white;
padding:25px;
text-align:center;
}

nav{
background:#333;
display:flex;
justify-content:center;
}

nav a{
color:white;
padding:14px 20px;
text-decoration:none;
}

nav a:hover{
background:#e74c3c;
}

.hero{
background:url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');
background-size:cover;
color:white;
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:40px;
}

.menu{
display:flex;
flex-wrap:wrap;
justify-content:center;
padding:20px;
}

.item{
background:white;
width:220px;
margin:15px;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px gray;
text-align:center;
}

button{
background:#e74c3c;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
}

footer{
background:#333;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}

</style>
</head>

<body>

<header>
<h1>Delicious Bites</h1>
<p>Fresh & Tasty Food</p>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">Contact</a>
</nav>

<div class="hero">
<h1>Welcome to Our Restaurant</h1>
<p>Enjoy the best food in town</p>
</div>

<div class="menu">

<div class="item">
<h3>Burger</h3>
<p>$5</p>
<button>Order Now</button>
</div>

<div class="item">
<h3>Pizza</h3>
<p>$8</p>
<button>Order Now</button>
</div>

<div class="item">
<h3>Fried Chicken</h3>
<p>$6</p>
<button>Order Now</button>
</div>

<div class="item">
<h3>Pasta</h3>
<p>$7</p>
<button>Order Now</button>
</div>

</div>

<footer>
<p>© 2026 Delicious Bites Restaurant</p>
</footer>

</body>
</html>
